name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for nuget.org trusted publishing, which exchanges this token for a short-lived
      # API key. Free on public repositories.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # The tag only TRIGGERS this; NuGet publishes whatever the csproj says. Without this check,
      # tagging v1.0.1 against a 1.0.0 csproj silently republishes 1.0.0, or fails as "already
      # published" with a confusing message.
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          csproj="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/VPNDetection/VPNDetection.csproj)"
          if [ "$tag" != "$csproj" ] ; then
            echo "tag $tag does not match VPNDetection.csproj version $csproj" >&2
            exit 1
          fi
      - run: dotnet test -c Release
      - run: dotnet pack src/VPNDetection/VPNDetection.csproj -c Release -o artifacts
      # nuget.org attaches a trusted-publishing policy to an EXISTING package, so the first release
      # goes out with the NUGET_API_KEY secret. Set the NUGET_USER variable once the policy exists
      # and the secret can be deleted.
      - uses: NuGet/login@v1
        id: oidc
        if: vars.NUGET_USER != ''
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to NuGet
        run: |
          dotnet nuget push 'artifacts/*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.oidc.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}

  # This version's section of CHANGELOG.md, as the tag's GitHub Release. It
  # waits for the publish, so no release page names a version the registry
  # cannot serve, and a re-run edits the release rather than failing on it.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if ! grep -q '^### ' notes.md ; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
